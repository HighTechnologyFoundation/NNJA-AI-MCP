name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check formatting
        run: uvx ruff format --check

      - name: Lint
        if: ${{ always() }}   # run even if formatting failed, to surface all issues at once
        run: uvx ruff check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true     # cache dependency downloads across runs

      - name: Install dependencies
        run: uv sync

      - name: Type check
        run: uvx ty check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true     # cache dependency downloads across runs

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest
